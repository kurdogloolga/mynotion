name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Docker network
        run: docker network create myapp

      - name: Start database
        run: |
          docker run -d \
            --network myapp \
            --name db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=tododb \
            -p 5432:5432 \
            postgres:15

      - name: Wait for database
        run: sleep 10

      - name: Build backend
        run: docker build -t mynotion-backend ./backend

      - name: Start backend
        run: |
          docker run -d \
            --network myapp \
            --name api \
            -e DB_HOST=db \
            -e DB_NAME=tododb \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e GMAIL_USER="" \
            -e GMAIL_PASSWORD="" \
            -p 5000:5000 \
            mynotion-backend

      - name: Build frontend
        run: docker build -t mynotion-frontend ./frontend

      - name: Start frontend
        run: |
          docker run -d \
            --network myapp \
            --name ui \
            -p 8080:80 \
            mynotion-frontend

      - name: Wait for services
        run: sleep 15

      - name: Test backend health
        run: |
          curl -f http://localhost:5000/auth/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"test@test.com\",\"password\":\"wrong\"}" || true
            
      - name: Test frontend health
        run: curl -f http://localhost:8080

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs api
          docker logs ui

      - name: Stop and remove containers
        if: always()
        run: |
          docker stop ui api db || true
          docker rm ui api db || true
          docker network rm myapp || true

  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mynotion-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mynotion-frontend:latest